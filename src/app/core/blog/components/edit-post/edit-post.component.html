<mat-card>
  <mat-card-header>
    <mat-card-title>Edit Post</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="editBlogForm">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Text</mat-label>
        <textarea
          matInput
          formControlName="text"
          rows="5"
          placeholder="Enter post text"
        ></textarea>
        <mat-error *ngIf="editBlogForm.get('text')?.hasError('required')"
          >Text is required</mat-error
        >
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="goBack()">Cancel</button>
    <button mat-button (click)="onSubmit()">Zapisz</button>
  </mat-card-actions>
</mat-card>
